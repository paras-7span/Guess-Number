<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Last Number Standing - Multiplayer Secret Number Elimination Game</title>
    <meta name="description" content="A strategic pass-the-device multiplayer elimination game for 2–10 players. Choose your secret number, guess rivals' numbers, and be the last player standing!" />
    <meta name="theme-color" content="#0A0E17" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind Play CDN for immediate preview and fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for Serverless Peer-to-Peer Multi-Device Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>

  <body class="bg-[#0A0E17] text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Main Single Page Application Container -->
    <div id="app"></div>

    <!-- Application Script -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
